<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#B266FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B266FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e0f0"/>
      <stop offset="100%" stop-color="#a89bbf"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- ornate corner flourishes -->
  <g stroke="#8b0000" stroke-width="2" fill="none" opacity="0.7">
    <path d="M20,20 L20,70 Q20,90 40,90 L90,90"/>
    <path d="M1180,20 L1180,70 Q1180,90 1160,90 L1110,90"/>
    <path d="M20,280 L20,230 Q20,210 40,210 L90,210"/>
    <path d="M1180,280 L1180,230 Q1180,210 1160,210 L1110,210"/>
  </g>
  <g fill="#B266FF" opacity="0.8">
    <circle cx="20" cy="20" r="4"/>
    <circle cx="1180" cy="20" r="4"/>
    <circle cx="20" cy="280" r="4"/>
    <circle cx="1180" cy="280" r="4"/>
  </g>

  <!-- thin double border -->
  <rect x="12" y="12" width="1176" height="276" fill="none" stroke="#4a1a6b" stroke-width="1.5" opacity="0.6"/>

  <!-- wings -->
  <g transform="translate(600,150)" filter="url(#softGlow)">
    <path d="M-40,-10 C-140,-70 -230,-40 -280,10 C-220,0 -160,-5 -110,10 C-160,20 -210,45 -240,80 C-180,55 -120,35 -60,35 Z"
          fill="#2d0a4e" stroke="#B266FF" stroke-width="1.5" opacity="0.85"/>
    <path d="M40,-10 C140,-70 230,-40 280,10 C220,0 160,-5 110,10 C160,20 210,45 240,80 C180,55 120,35 60,35 Z"
          fill="#2d0a4e" stroke="#B266FF" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- skull -->
  <g transform="translate(600,150)" filter="url(#softGlow)">
    <ellipse cx="0" cy="-10" rx="55" ry="50" fill="url(#boneGrad)"/>
    <path d="M-45,10 Q-40,55 0,60 Q40,55 45,10 Q30,25 0,25 Q-30,25 -45,10 Z" fill="url(#boneGrad)"/>
    <ellipse cx="-22" cy="-8" rx="13" ry="16" fill="#0a0a0a"/>
    <ellipse cx="22" cy="-8" rx="13" ry="16" fill="#0a0a0a"/>
    <circle cx="-22" cy="-8" r="4" fill="#8b0000"/>
    <circle cx="22" cy="-8" r="4" fill="#8b0000"/>
    <path d="M0,4 L-6,18 L6,18 Z" fill="#0a0a0a"/>
    <g stroke="#0a0a0a" stroke-width="2">
      <line x1="-25" y1="35" x2="-25" y2="45"/>
      <line x1="-14" y1="37" x2="-14" y2="47"/>
      <line x1="-3" y1="38" x2="-3" y2="48"/>
      <line x1="8" y1="37" x2="8" y2="47"/>
      <line x1="19" y1="35" x2="19" y2="45"/>
    </g>
    <!-- small horns -->
    <path d="M-30,-45 Q-45,-70 -35,-90" fill="none" stroke="#3a0a0a" stroke-width="6" stroke-linecap="round"/>
    <path d="M30,-45 Q45,-70 35,-90" fill="none" stroke="#3a0a0a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="600" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46"
        letter-spacing="10" fill="#e8dcff" font-weight="bold">ZANNOERR</text>
  <text x="600" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="15"
        letter-spacing="4" fill="#8b0000" font-style="italic">Full-Stack Necromancer  •  Code by Day, Conjure by Night</text>
</svg>
