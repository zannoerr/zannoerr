<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#05000d"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2ec4"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#c724ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2ec4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- circuit-like network lines -->
  <g stroke="#ff6ec7" stroke-opacity="0.22" stroke-width="2" fill="none" filter="url(#softglow)">
    <path d="M0 60 H180 L210 90 H420"/>
    <path d="M1200 240 H1000 L970 210 H760"/>
    <path d="M0 250 H120 L150 220 H320 L350 250 H520"/>
    <path d="M1200 40 H1040 L1010 70 H860"/>
  </g>
  <g fill="#ff2ec4" filter="url(#softglow)">
    <circle cx="180" cy="60" r="4"/>
    <circle cx="420" cy="90" r="4"/>
    <circle cx="1000" cy="240" r="4"/>
    <circle cx="760" cy="210" r="4"/>
    <circle cx="320" cy="220" r="4"/>
    <circle cx="1040" cy="40" r="4"/>
    <circle cx="860" cy="70" r="4"/>
  </g>

  <!-- main title -->
  <text x="600" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="62" font-weight="bold" fill="url(#neon)" filter="url(#glow)">ZANNOERR</text>

  <!-- subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#ff9be8" filter="url(#softglow)" letter-spacing="2">&lt; Network Engineer • Linux User • Vibe Coder /&gt;</text>

  <!-- decorative bracket accents -->
  <text x="120" y="165" font-family="'Courier New', monospace" font-size="60" fill="#c724ff" opacity="0.8" filter="url(#softglow)">&lt;/&gt;</text>
  <text x="1000" y="165" font-family="'Courier New', monospace" font-size="60" fill="#c724ff" opacity="0.8" filter="url(#softglow)">#!/</text>

  <rect x="250" y="220" width="700" height="2" fill="url(#neon)" filter="url(#softglow)" opacity="0.7"/>
</svg>
